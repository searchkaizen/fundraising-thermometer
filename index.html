<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraising Thermometer Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" id="googleFontLink">

    <style>
        /* Custom styles */
        :root {
            font-size: 16px;
        }

        body {
            font-family: 'Inter', sans-serif; /* Default font */
        }
        input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 2.5rem; /* 40px */
            height: 2.5rem; /* 40px */
            padding: 0;
            border: none;
            border-radius: 0.5rem; /* 8px */
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
            border-radius: 0.5rem; /* 8px */
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #ccc;
            border-radius: 0.5rem; /* 8px */
        }
        input[type="color"]::-moz-color-swatch {
            border: 1px solid #ccc;
            border-radius: 0.5rem; /* 8px */
        }

        /* Styles using REM units */
        .donation-meter-container {
             display: flex;
             justify-content: center;
             padding-top: 0.625rem; /* 10px */
             padding-bottom: 1.25rem; /* 20px */
             padding-left: 7rem;
             padding-right: 7rem;
        }

        .donation-meter {
            text-align: center;
            position: relative;
            width: 9.375rem; /* 150px */
        }

        .donation-meter strong {
            display: block;
            text-align: center;
            color: #374151;
            margin-bottom: 0.25rem; /* 4px */
        }

        /* Adjusted goal amount text size */
        .donation-meter .goal-amount-text {
            font-size: 1.5rem; /* Tailwind text-2xl (approx 1.5x increase) */
            font-weight: 600;
            color: #4B5563;
        }

        .donation-meter .glass {
            background: #e5e5e5;
            border-radius: 6.25rem 6.25rem 0 0; /* 100px */
            display: block;
            height: 18.75rem; /* 300px */
            margin: 0 auto 0.625rem auto; /* 10px */
            padding: 0.3125rem; /* 5px */
            position: relative; /* Crucial for positioning ticks */
            width: 4.375rem; /* 70px */
            box-sizing: border-box;
        }

        .donation-meter .amount {
            background: #F1B241;
            border-radius: 6.25rem 6.25rem 0 0; /* 100px */
            display: block;
            width: 3.75rem; /* 60px */
            position: absolute;
            bottom: 0.3125rem; /* 5px */
            left: 0.3125rem; /* 5px */
            height: 0%;
            transition: height 0.5s ease-out, background-color 0.3s ease;
            z-index: 1; /* Ensure fill is behind ticks */
        }

         /* --- Bulb Styles --- */
        .donation-meter .bulb {
            background: #e5e5e5;
            border-radius: 6.25rem; /* 100px */
            display: block;
            height: 6.25rem; /* 100px */
            width: 6.25rem; /* 100px */
            padding: 0.3125rem; /* 5px */
            position: relative;
            top: -2.1875rem; /* -35px */
            margin: 0 auto;
            box-sizing: border-box;
        }

        .donation-meter .bulb .red-circle {
            background: #F1B241;
            border-radius: 6.25rem; /* 100px */
            display: block;
            height: 5.625rem; /* 90px */
            width: 5.625rem; /* 90px */
            transition: background-color 0.3s ease;
        }

        .donation-meter .bulb .filler {
            background: #F1B241;
            display: block;
            height: 1.875rem; /* 30px */
            width: 3.75rem; /* 60px */
            position: absolute;
            top: -0.3125rem; /* -5px */
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            transition: background-color 0.3s ease;
        }

        /* --- Logo and Label Group Styles --- */
        .label-logo-group {
            position: absolute;
            left: calc(50% + 2.1875rem + 0.5rem); /* Center + Half Glass Width + Small Gap */
            bottom: 0.3125rem; /* Initial value, JS will override */
            display: flex;
            /* --- Changed flex-direction --- */
            flex-direction: column-reverse; /* Stack label above logo */
            align-items: center; /* Center items horizontally in the group */
             /* --- Width determined by content (label or logo) --- */
            width: max-content;
            max-width: 9.375rem; /* 150px - Prevent group getting too wide */
            transform: translateY(50%); /* Vertically center group relative to fill level */
            transition: bottom 0.5s ease-out, opacity 0.3s ease;
            opacity: 0; /* Hidden by default */
            z-index: 10;
            pointer-events: none;
        }
        .label-logo-group.visible {
            opacity: 1;
        }

        /* --- Logo Styles (within group) --- */
        #logoPreview {
             /* --- Logo width matches parent group (label width) --- */
            width: 100%;
            max-width: 100%; /* Ensure it doesn't exceed parent */
            max-height: 50px; /* Keep vertical constraint */
            object-fit: contain;
            display: none; /* Hidden by default, shown by JS */
             /* --- Added margin-top for spacing --- */
            margin-top: 0.3rem; /* Space between label and logo */
            /* margin-bottom: 0.3rem; Removed */
        }

        /* --- Amount Label Styles (within group) --- */
        .amount-label {
            background-color: #4B5563;
            color: white;
            padding: 0.3125rem 0.625rem; /* 5px 10px */
            border-radius: 0.25rem; /* 4px */
            font-size: 1.2rem; /* was 0.8rem */
            font-weight: 600;
            white-space: nowrap;
            line-height: 1.3;
            text-align: center;
            position: relative; /* Needed for the pseudo-element arrow */
            display: none; /* Hidden by default, shown by JS */
        }

        .amount-label::before { /* The triangle arrow */
            content: '';
            position: absolute;
            top: 50%;
            right: 100%; /* Position arrow to the left of the label */
            margin-top: -0.5rem; /* -8px */
            border-width: 0.5rem; /* 8px */
            border-style: solid;
            border-color: transparent #4B5563 transparent transparent;
        }

        /* --- Tick Mark Styles (Inside) --- */
        .tick-mark {
            position: absolute;
            background-color: #6B7280; /* Tailwind gray-500 */
            height: 0.125rem; /* 2px */
            width: 0.625rem; /* 10px */
            left: 0.3125rem; /* Position relative to left padding */
            transform: translateY(50%); /* Center vertically */
            z-index: 2; /* Above fill, below label */
        }

        /* --- General Logo Upload Styles --- */
        #removeLogoBtn {
            display: none; /* Hidden by default */
            font-size: 0.75rem;
            color: #EF4444; /* Red */
            cursor: pointer;
            margin-left: 0.5rem;
            background: none;
            border: none;
            padding: 0;
        }
        #removeLogoBtn:hover {
            text-decoration: underline;
        }

        /* --- Elements affected by font change --- */
        .font-target {
            /* Add transition for smoother font change */
            transition: font-family 0.3s ease;
        }

    </style>
     </head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-lg">
        <h2 class="text-2xl sm:text-3xl font-bold text-center text-gray-800 mb-6">Fundraising Thermometer</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                <input type="text" id="title" placeholder="e.g., Library Fund" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="goal" class="block text-sm font-medium text-gray-700 mb-1">Goal Amount ($)</label>
                <input type="number" id="goal" placeholder="e.g., 10000" min="1" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="raised" class="block text-sm font-medium text-gray-700 mb-1">Amount Raised ($)</label>
                <input type="number" id="raised" placeholder="e.g., 3500" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div class="flex flex-col items-start">
                <label for="fillColor" class="block text-sm font-medium text-gray-700 mb-1">Fill Color</label>
                 <input type="color" id="fillColor" value="#F1B241" class="shadow-sm">
             </div>
              <div>
                 <label for="fontSelector" class="block text-sm font-medium text-gray-700 mb-1">Font</label>
                 <select id="fontSelector" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                     <option value="Inter">Inter (Default)</option>
                     <option value="Roboto">Roboto</option>
                     <option value="Open Sans">Open Sans</option>
                     <option value="Montserrat">Montserrat</option>
                     <option value="Lato">Lato</option>
                     <option value="Oswald">Oswald</option>
                     <option value="Lobster">Lobster</option>
                     <option value="Poppins">Poppins</option>
                     <option value="Nunito Sans">Nunito Sans</option>
                 </select>
             </div>
             <div class="sm:col-span-2">
                 <label for="logoUpload" class="block text-sm font-medium text-gray-700 mb-1">
                     Upload Logo (Optional)
                     <button id="removeLogoBtn" onclick="removeLogo()">Remove</button>
                 </label>
                 <input type="file" id="logoUpload" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
             </div>
        </div>

        <div class="thermometer-container text-center p-4 rounded-lg bg-gray-50 border border-gray-200" id="capture">
            <h3 id="displayTitle" class="text-3xl font-semibold text-gray-700 mb-4 font-target">Fundraising Progress</h3>

            <div class="donation-meter-container">
                 <div class="donation-meter">
                     <strong class="goal-amount-text text-2xl font-target" id="displayGoalAmount">$0 Goal</strong>
                    <span class="glass">
                        <span class="amount" id="thermoFillAmount" style="height: 0%"></span>

                        <span class="tick-mark" style="bottom: 10%;"></span>
                        <span class="tick-mark" style="bottom: 20%;"></span>
                        <span class="tick-mark" style="bottom: 30%;"></span>
                        <span class="tick-mark" style="bottom: 40%;"></span>
                        <span class="tick-mark" style="bottom: 50%;"></span>
                        <span class="tick-mark" style="bottom: 60%;"></span>
                        <span class="tick-mark" style="bottom: 70%;"></span>
                        <span class="tick-mark" style="bottom: 80%;"></span>
                        <span class="tick-mark" style="bottom: 90%;"></span>

                    </span>
                     <div class="label-logo-group" id="labelLogoGroup">
                         <div class="amount-label font-target" id="amountLabel">
                            $0<br>Raised
                        </div>
                         <img id="logoPreview" src="#" alt="Uploaded Logo Preview">
                     </div>
                    <div class="bulb">
                        <span class="red-circle" id="bulbFillCircle"></span>
                        <span class="filler" id="bulbFiller"></span>
                    </div>
                </div>
            </div>

             </div>

        <div class="mt-6 text-center">
             <button
                onclick="downloadThermometer()"
                class="bg-[#F1B241] text-black hover:bg-black hover:text-[#F1B241] font-bold py-2 px-6 rounded-lg shadow-md transition duration-300 ease-in-out">
                Download PNG
            </button>
        </div>
    </div>

    <script>
        // Get references to DOM elements
        const goalInput = document.getElementById('goal');
        const raisedInput = document.getElementById('raised');
        const fillColorInput = document.getElementById('fillColor');
        const titleInput = document.getElementById('title');
        const displayTitle = document.getElementById('displayTitle');
        const logoUploadInput = document.getElementById('logoUpload');
        const logoPreview = document.getElementById('logoPreview');
        const removeLogoBtn = document.getElementById('removeLogoBtn');
        const fontSelector = document.getElementById('fontSelector');
        const googleFontLink = document.getElementById('googleFontLink');

        // CSS Thermometer specific elements
        const displayGoalAmount = document.getElementById('displayGoalAmount');
        const thermoFillAmount = document.getElementById('thermoFillAmount');
        const bulbFillCircle = document.getElementById('bulbFillCircle');
        const bulbFiller = document.getElementById('bulbFiller');
        const glassElement = document.querySelector('.donation-meter .glass');
        const amountLabel = document.getElementById('amountLabel');
        const donationMeterElement = document.querySelector('.donation-meter');
        const labelLogoGroup = document.getElementById('labelLogoGroup'); // Get the group container
        const fontTargets = document.querySelectorAll('.font-target');

        // --- Define constants based on REM values ---
        const GLASS_HEIGHT_REM = 18.75;
        const GLASS_PADDING_REM = 0.3125;
        const GLASS_INNER_HEIGHT_REM = GLASS_HEIGHT_REM - (2 * GLASS_PADDING_REM);
        const BULB_HEIGHT_REM = 6.25;
        const BULB_OFFSET_REM = 2.1875;
        // Adjust min bottom for the group based on bulb position
        const MIN_BOTTOM_OFFSET_REM_GROUP = BULB_HEIGHT_REM - BULB_OFFSET_REM + GLASS_PADDING_REM + 1; // Add buffer

        // Function to update the thermometer visualization
        function renderThermometer() {
            // Get values, providing defaults and ensuring numbers
            const goal = parseFloat(goalInput.value) || 0;
            const raised = parseFloat(raisedInput.value) || 0;
            const fillColor = fillColorInput.value;
            const title = titleInput.value.trim() || 'Fundraising Progress';

            // Update title
            displayTitle.innerText = title;
            // Update goal amount text above thermometer
             if (displayGoalAmount) {
                 displayGoalAmount.innerText = `$${goal.toLocaleString()} Goal`;
             }

            let percent = 0;

            // Validate goal and calculate percentage
            if (goal <= 0) {
                percent = 0;
            } else {
                percent = Math.min(Math.max((raised / goal) * 100, 0), 100);
            }

            // --- Update CSS Thermometer ---
            const percentString = percent + '%';

            if (thermoFillAmount) {
                 thermoFillAmount.style.height = percentString;
                 thermoFillAmount.style.backgroundColor = fillColor;
            }
            if (bulbFillCircle) {
                 bulbFillCircle.style.backgroundColor = fillColor;
            }
             if (bulbFiller) {
                 bulbFiller.style.backgroundColor = fillColor;
                 bulbFiller.style.display = percent > 0 ? 'block' : 'none';
            }

            // Update the position and visibility of the label/logo group
            if (labelLogoGroup && glassElement && donationMeterElement) {
                // Show group only if amount raised is > 0
                if (raised > 0) {
                    // Set label text
                    amountLabel.innerHTML = `$${raised.toLocaleString()}<br>Raised`;
                    amountLabel.style.display = 'block'; // Ensure label text is visible

                    // Calculate bottom position for the group
                    const fillTopRelativeGlassBottomRem = (percent / 100 * GLASS_INNER_HEIGHT_REM) + GLASS_PADDING_REM;
                    const glassBottomRelativeMeterBottomRem = BULB_HEIGHT_REM - BULB_OFFSET_REM;
                    const groupBottomRem = glassBottomRelativeMeterBottomRem + fillTopRelativeGlassBottomRem;

                    // Set bottom position in REM units, ensuring minimum position
                    labelLogoGroup.style.bottom = Math.max(MIN_BOTTOM_OFFSET_REM_GROUP, groupBottomRem) + 'rem';
                    labelLogoGroup.classList.add('visible'); // Make group visible
                } else {
                    labelLogoGroup.classList.remove('visible'); // Hide group if $0 raised
                    amountLabel.style.display = 'none'; // Also hide label text explicitly
                }
            }
        }

        // --- Font Change Handling ---
        fontSelector.addEventListener('change', function(event) {
            const selectedFont = event.target.value;
            applyFont(selectedFont);
        });

        function applyFont(fontName) {
            // Construct Google Font URL
            const fontUrl = `https://fonts.googleapis.com/css2?family=${fontName.replace(/ /g, '+')}:wght@400;600;700&display=swap`;

            // Update the href of the existing link tag
            if (googleFontLink) {
                googleFontLink.href = fontUrl;
            }

            // Apply the font-family to target elements
            const fontFamily = `'${fontName}', sans-serif`; // Add fallback
            fontTargets.forEach(target => {
                target.style.fontFamily = fontFamily;
            });
        }


        // --- Logo Upload Handling ---
        logoUploadInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) { // Check if it's an image
                const reader = new FileReader();

                reader.onload = function(e) {
                    logoPreview.src = e.target.result;
                    logoPreview.style.display = 'block'; // Show the logo
                    removeLogoBtn.style.display = 'inline'; // Show remove button
                }
                reader.readAsDataURL(file); // Read file as Data URL
            } else {
                // Optional: Clear preview if invalid file selected
                removeLogo(); // Call remove function to reset
                if (file) { // Only alert if a file was actually selected
                  alert('Please select a valid image file (e.g., PNG, JPG, GIF).');
                }
            }
        });

        // Function to remove the logo
        function removeLogo() {
            logoPreview.src = '#'; // Clear src
            logoPreview.style.display = 'none'; // Hide logo
            removeLogoBtn.style.display = 'none'; // Hide remove button
            logoUploadInput.value = ''; // Reset file input
        }


        // Function to handle PNG download
        function downloadThermometer() {
            const elementToCapture = document.getElementById('capture');

            // Ensure logo is loaded before capturing
            setTimeout(() => {
                html2canvas(elementToCapture, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    logging: false,
                    useCORS: true,
                    scrollX: -window.scrollX,
                    scrollY: -window.scrollY,
                    windowWidth: document.documentElement.offsetWidth,
                    windowHeight: document.documentElement.offsetHeight
                    }).then(canvas => {
                    const link = document.createElement('a');
                    const title = titleInput.value.trim() || 'fundraising-thermometer';
                    const filename = title.toLowerCase()
                                        .replace(/\s+/g, '-')
                                        .replace(/[^\w-]+/g, '')
                                        .replace(/--+/g, '-')
                                        .replace(/^-+/, '')
                                        .replace(/-+$/, '')
                                        + '.png';
                    link.download = filename || 'thermometer.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                }).catch(err => {
                    console.error("Error generating canvas: ", err);
                    const downloadButton = document.querySelector('button[onclick="downloadThermometer()"]');
                    if (downloadButton) {
                        const originalText = downloadButton.innerText;
                        downloadButton.innerText = 'Error downloading!';
                        // Use specific hex colors for error state if desired, or keep red
                        downloadButton.classList.add('bg-red-500', 'hover:bg-red-600', 'text-white');
                        downloadButton.classList.remove('bg-[#F1B241]', 'text-black', 'hover:bg-black', 'hover:text-[#F1B241]');
                        setTimeout(() => {
                            if (downloadButton) {
                                downloadButton.innerText = originalText;
                                downloadButton.classList.remove('bg-red-500', 'hover:bg-red-600', 'text-white');
                                // Restore original classes
                                downloadButton.classList.add('bg-[#F1B241]', 'text-black', 'hover:bg-black', 'hover:text-[#F1B241]');
                            }
                        }, 3000);
                    }
                });
            }, 100);
        }

        // Add event listeners for automatic updates
        goalInput.addEventListener('input', renderThermometer);
        raisedInput.addEventListener('input', renderThermometer);
        fillColorInput.addEventListener('input', renderThermometer);
        titleInput.addEventListener('input', renderThermometer);
        fontSelector.addEventListener('change', (event) => { // Listener for font selector
            applyFont(event.target.value);
        });


        // Initial render on page load
         window.onload = () => {
            applyFont(fontSelector.value); // Apply initial font
            renderThermometer(); // Render thermometer state
         };

    </script>
</body>
</html>
